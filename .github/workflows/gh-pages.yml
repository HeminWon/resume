name: Publish gh-pages

on:
  workflow_dispatch:
    inputs:
      path:
        description: "Publish path directory (default: current UTC year when empty)"
        required: false
        type: string
      sync_latest:
        description: "Also sync to latest/"
        required: false
        default: false
        type: boolean
      with_footer:
        description: "Include PDF footer"
        required: false
        default: true
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build (with PDFs)
        env:
          PDF_FOOTER: ${{ inputs.with_footer }}
        run: scripts/build.sh

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare gh-pages branch
        id: prepare
        run: scripts/core/prepare-gh-pages.sh

      - name: Publish to gh-pages
        env:
          PUBLISH_PATH: ${{ inputs.path }}
          SYNC_LATEST: ${{ inputs.sync_latest }}
          WORKTREE_DIR: ${{ steps.prepare.outputs.worktree_dir }}
        run: scripts/core/publish-gh-pages.sh

      - name: Cleanup gh-pages worktree
        if: ${{ always() }}
        run: |
          if [[ -n "${{ steps.prepare.outputs.worktree_dir }}" ]]; then
            git worktree remove "${{ steps.prepare.outputs.worktree_dir }}"
          fi
