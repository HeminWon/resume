skills:
  - name: Technical Depth (iOS)
    level: Proficient
    keywords:
      - Strong dual-stack development capability in Objective-C and Swift; able to independently design, implement, and maintain UIKit and SwiftUI/Combine scenarios.
      - Systematic understanding of Runtime, RunLoop, memory management, and concurrency models (GCD / NSOperation / Swift Concurrency) for complex issue diagnosis and governance.
      - Proficient in dependency management and component integration with CocoaPods and SwiftPM, ensuring stable iteration in multi-module projects.
  - name: Architecture Capability
    level: Proficient
    keywords:
      - Able to perform state modeling and module boundary decomposition based on TCA / Redux / MVVM to support long-term evolution of complex products.
      - Experienced in implementing business componentization and configuration-based delivery, enabling cross-project capability reuse and lower maintenance cost.
      - Able to drive end-to-end delivery from requirement decomposition and solution design to risk identification.
  - name: Engineering Efficiency & Quality
    level: Proficient
    keywords:
      - Able to lead performance governance across startup, rendering, scrolling, and app package size, continuously improving responsiveness and user experience.
      - Proficient in locating and closing performance bottlenecks using Instruments (Time Profiler / Allocations / Leaks) and logging systems.
      - Experienced in crash analysis and online stability governance, driving continuous improvement from issue discovery to remediation.
  - name: AI Productivity (Engineering)
    level: Proficient
    keywords:
      - Use Claude Code, Codex, and Cursor to assist code refactoring, issue diagnosis, and documentation, improving delivery efficiency and review quality.
      - Experienced in prompt iteration and Skill / Agent / MCP workflow practices for development and code review processes.
