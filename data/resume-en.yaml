projects:
  - name: Seekee
    startDate: '2025-07-03'
    description: >-
      An AI browser for Latin America (Mexico, Brazil) and Turkey, integrating
      search, creation, and multimedia experiences.
    duties:
      - Owned the architecture and UX delivery of the Super Search module (intent recognition, voice search, text-to-image/image-to-image, translation, and document parsing), bridging cloud AI capabilities to on-device interaction flows.
    highlights:
      - Built a unified Super Search entry with SwiftUI + Combine, and split state/business logic using a TCA feature-based approach to improve extensibility, testability, and maintainability.
      - Evaluated multiple Markdown libraries for streaming output support and rendering behavior, selected swift-markdown-ui, and optimized AI summary streaming UX with SSE.
      - Led interaction refinements on the search results page, covering skeleton states, task-level loading/error states, and improving image-generation progress algorithms and animations.
  - name: Honda RoadSync
    startDate: '2024-08-01'
    endDate: '2024-12-18'
    description: >-
      Honda RoadSync is a smart mobility app launched by Honda to support its
      motorcycle lineup, providing convenient and safe digital services for riders.
      Via Bluetooth connection between phone and motorcycle, users can operate
      navigation, calls, music playback, and notifications while staying focused
      on riding.
    duties:
      - Led localization delivery of Honda RoadSync as the technical PM and handed over to Honda Japan R&D.
    highlights:
      - 'Used classic Bluetooth to integrate cluster features like navigation, VoIP, music, volume, and weather; supported handlebar four-way switch control and voice prompts.'
      - 'Built with SwiftUI and Combine; used Redux for state management and event dispatch.'
  - name: Smart Living & Smart Mobility OEM Suite
    startDate: '2019-05-01'
    endDate: '2024-08-31'
    description: Tuya provides one-stop OEM app building and management. Based on official templates, OEM apps offer easy UI customization and allow clients to configure brand settings.
    duties:
      - 'Iterated on Smart Living OEM features, maintaining home/member management, device/room lists, pairing, and message center.'
      - 'Independently led Smart Mobility OEM iterations, including BLE+X device control, geofencing, third-party map navigation, passive unlocking, and Siri control.'
    highlights:
      - 'OEM development model with configuration files; apps generated on demand after IoT platform configuration, with code pruning support.'
      - 'Supported multiple pairing methods: EZ (Wi-Fi quick connect), AP (hotspot), NB-IoT, Bluetooth, QR code, etc.'
      - >-
        Delivered an SDK that digitizes physical entities via a Thing Model,
        abstracting device instances with attributes, action events, and services,
        using MQTT for control and state monitoring.
      - 'Wide protocol support: Matter, Zigbee, BLE, Sigmesh, Beacon, Cat.1, etc.'
      - 'Enabled Tuya devices for Home Assistant so users can control Tuya IoT devices within Home Assistant.'
